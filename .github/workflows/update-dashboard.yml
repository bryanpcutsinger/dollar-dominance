name: Update Dashboard

on:
  schedule:
    # Weekly: Monday 8 AM UTC (3 AM Eastern)
    - cron: '0 8 * * 1'
  workflow_dispatch:  # Manual trigger from Actions tab

permissions:
  contents: write
  issues: write  # For failure notifications

concurrency:
  group: update-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Cache raw data (BIS bulk download)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: data/raw
          key: data-raw-${{ github.run_id }}
          restore-keys: data-raw-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 run_pipeline.py

      - name: Commit and push if changed
        run: |
          git diff --quiet docs/index.html && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Update dashboard data (automated $(date -u +%Y-%m-%d))"
          git push

      - name: Create issue on failure
        if: failure()
        run: |
          gh issue create \
            --title "Dashboard auto-update failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled pipeline run failed. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
            --label "bug"
        env:
          GH_TOKEN: ${{ github.token }}
